<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vreme</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg1:#0f2027;--bg2:#203a43;--bg3:#2c5364;
  --glass:rgba(255,255,255,0.08);
  --glass-border:rgba(255,255,255,0.15);
  --text:#e8f4f8;--text-dim:rgba(232,244,248,0.6);
  --accent:#4fc3f7;--accent2:#81d4fa;
  --card-radius:20px;
  --trans:all 0.6s cubic-bezier(0.4,0,0.2,1);
}

html{
  background:var(--bg1);
  overscroll-behavior-y:none;
}

body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  background:var(--bg1);
  color:var(--text);
  overflow-x:hidden;
  overscroll-behavior-y:none;
  transition:var(--trans);
}

/* ── DYNAMIC BACKGROUNDS ── */
#bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  transition:background 1.5s ease;
}

body.weather-clear-day    #bg{background:linear-gradient(160deg,#1565c0 0%,#1e88e5 40%,#42a5f5 70%,#90caf9 100%)}
body.weather-clear-night  #bg{background:linear-gradient(160deg,#0a0e27 0%,#0d1b4b 50%,#1a237e 100%)}
body.weather-clouds-day   #bg{background:linear-gradient(160deg,#37474f 0%,#546e7a 50%,#78909c 100%)}
body.weather-clouds-night #bg{background:linear-gradient(160deg,#1c2030 0%,#263045 50%,#37474f 100%)}
body.weather-rain-day     #bg{background:linear-gradient(160deg,#1a237e 0%,#283593 40%,#3949ab 70%,#5c6bc0 100%)}
body.weather-rain-night   #bg{background:linear-gradient(160deg,#0d0d1a 0%,#1a1a3e 50%,#252565 100%)}
body.weather-storm-day    #bg{background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
body.weather-storm-night  #bg{background:linear-gradient(160deg,#0a0a0f 0%,#0f0f1a 50%,#1a1a2e 100%)}
body.weather-snow-day     #bg{background:linear-gradient(160deg,#b3e5fc 0%,#e1f5fe 50%,#f5f5f5 100%);color:#1a237e}
body.weather-snow-night   #bg{background:linear-gradient(160deg,#1c2f3f 0%,#263545 50%,#37474f 100%)}
body.weather-fog-day      #bg{background:linear-gradient(160deg,#607d8b 0%,#90a4ae 50%,#b0bec5 100%)}
body.weather-fog-night    #bg{background:linear-gradient(160deg,#1c2228 0%,#2c3440 50%,#37444f 100%)}

/* Snow day text fix */
body.weather-snow-day     {color:#1a237e}
body.weather-snow-day .text-dim{color:rgba(26,35,126,0.6)}

/* ── PARTICLES ── */
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;opacity:0;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translateY(-20px) translateX(0);opacity:0.8}
  100%{transform:translateY(110vh) translateX(30px);opacity:0}
}
@keyframes flake{
  0%{transform:translateY(-20px) rotate(0deg);opacity:0.9}
  100%{transform:translateY(110vh) rotate(360deg);opacity:0}
}
@keyframes twinkle{
  0%,100%{opacity:0.2}50%{opacity:1}
}
@keyframes lightning{
  0%,95%,100%{opacity:0}96%,98%{opacity:1}
}

/* ── LAYOUT ── */
#app{position:relative;z-index:2;min-height:100vh;max-width:1100px;margin:0 auto;padding:24px 20px 60px}

/* ── SEARCH BAR ── */
.search-wrap{
  display:flex;align-items:center;gap:10px;
  margin-bottom:28px;
  position:relative;
}
.search-box{
  flex:1;position:relative;
}
.search-box input{
  width:100%;
  padding:14px 20px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:50px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:15px;
  outline:none;
  transition:var(--trans);
}
.search-box input::placeholder{color:var(--text-dim)}
.search-box input:focus{
  background:rgba(255,255,255,0.18);
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(79,195,247,0.15);
}
.search-icon{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  opacity:0.5;pointer-events:none;
}
.suggestions{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:rgba(15,32,39,0.95);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:16px;
  overflow:hidden;
  z-index:100;
  display:none;
}
.suggestions.open{display:block}
.sug-item{
  padding:12px 20px;
  cursor:pointer;
  font-size:14px;
  display:flex;align-items:center;gap:10px;
  transition:background 0.2s;
}
.sug-item:hover{background:rgba(79,195,247,0.15)}
.sug-item svg{opacity:0.5;flex-shrink:0}

.btn-gps{
  width:50px;height:50px;
  border-radius:50%;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.2);
  color:var(--text);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:var(--trans);
  flex-shrink:0;
}
.btn-gps:hover{background:rgba(79,195,247,0.25);border-color:var(--accent);transform:scale(1.05)}
.btn-gps.loading{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── QUICK LOCATIONS ── */
.btn-quick{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;
  background:rgba(255,255,255,0.09);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:50px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:12px;
  cursor:pointer;
  transition:all 0.2s;
  white-space:nowrap;
}
.btn-quick:hover{background:rgba(79,195,247,0.2);border-color:rgba(79,195,247,0.5)}
.btn-quick.active{background:rgba(79,195,247,0.25);border-color:rgba(79,195,247,0.6);color:#4fc3f7}
.btn-quick svg{opacity:0.6}

/* ── ERROR ── */
#error-msg{
  text-align:center;padding:20px;
  color:#ff7043;font-size:14px;
  display:none;
}

/* ── MAIN WEATHER CARD ── */
.main-card{
  background:var(--glass);
  backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  border-radius:var(--card-radius);
  padding:32px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}
.main-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at top right,rgba(79,195,247,0.08),transparent 60%);
  pointer-events:none;
}

.location-row{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-dim);
  margin-bottom:8px;
}
.city-name{
  font-family:'DM Sans',sans-serif;
  font-size:clamp(22px,5vw,34px);
  font-weight:700;
  letter-spacing:-0.5px;
}
.weather-main{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:20px;
  margin-top:20px;
}
.temp-block{display:flex;align-items:flex-start;gap:4px}
.temp-val{
  font-size:clamp(60px,12vw,96px);
  font-weight:300;
  line-height:1;
  letter-spacing:-4px;
  font-family:'DM Sans',sans-serif;
}
.temp-unit{font-size:28px;margin-top:12px;opacity:0.7}

.weather-icon-main{
  width:120px;height:120px;
  flex-shrink:0;
}

.weather-desc{
  font-size:16px;
  text-transform:capitalize;
  color:var(--text-dim);
  margin-top:4px;
}
.feel{font-size:13px;color:var(--text-dim);margin-top:4px}

/* ── ALERTĂ PLOAIE ── */
.rain-alert {
  display: none;
  background: rgba(244, 67, 54, 0.2);
  border: 1px solid rgba(244, 67, 54, 0.4);
  color: #ff8a80;
  padding: 10px 16px;
  border-radius: 12px;
  margin-top: 12px;
  font-size: 14px;
  font-weight: 500;
  align-items: center;
  gap: 8px;
  animation: pulse-alert 2s infinite alternate;
}
body.weather-snow-day .rain-alert { color: #b71c1c; background: rgba(244, 67, 54, 0.15); }
@keyframes pulse-alert {
  0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.2); }
  100% { box-shadow: 0 0 0 6px rgba(244, 67, 54, 0); }
}

.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:14px;
  margin-top:24px;
}
.stat{
  background:rgba(255,255,255,0.06);
  border-radius:14px;
  padding:14px;
  display:flex;flex-direction:column;gap:4px;
}
.stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px}
.stat-val{font-size:18px;font-weight:600}
.stat-unit{font-size:11px;color:var(--text-dim)}

/* ── SECTION TITLE ── */
.section-title{
  font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--text-dim);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.section-title::after{
  content:'';flex:1;height:1px;
  background:rgba(255,255,255,0.1);
}

/* ── HOURLY STRIP ── */
.hourly-outer{
  background:var(--glass);
  backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  border-radius:var(--card-radius);
  padding:20px;
  margin-bottom:20px;
}
.hourly-scroll{
  display:flex;gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.15) transparent;
}
.hourly-scroll::-webkit-scrollbar{height:4px}
.hourly-scroll::-webkit-scrollbar-track{background:transparent}
.hourly-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}

.hour-card{
  flex-shrink:0;
  width:72px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:12px 8px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:background 0.2s;
  cursor:default;
}
.hour-card.now{
  background:rgba(79,195,247,0.2);
  border-color:rgba(79,195,247,0.4);
}
.hour-card:hover{background:rgba(255,255,255,0.1)}
.hour-time{font-size:11px;color:var(--text-dim)}
.hour-icon{width:32px;height:32px}
.hour-temp{font-size:15px;font-weight:600}
.hour-rain{font-size:10px;color:#90caf9}

/* ── RAIN NEXT 6H CHART ── */
.chart-card{
  background:var(--glass);
  backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  border-radius:var(--card-radius);
  padding:20px;
  margin-bottom:20px;
}
.chart-wrap{position:relative;height:180px}

/* ── 10-DAY FORECAST ── */
.ten-day-card{
  background:var(--glass);
  backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  border-radius:var(--card-radius);
  padding:20px;
  margin-bottom:20px;
}
.day-row{
  display:flex;align-items:center;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
  gap:12px;
}
.day-row:last-child{border-bottom:none}
.day-name{width:90px;font-size:14px}
.day-icon{width:28px;height:28px;flex-shrink:0}
.day-desc{flex:1;font-size:12px;color:var(--text-dim);min-width:60px}
.day-rain{font-size:12px;color:#90caf9;width:40px;text-align:right}
.day-temps{display:flex;align-items:center;gap:8px;margin-left:auto}
.day-min{font-size:13px;color:var(--text-dim)}
.day-max{font-size:15px;font-weight:600}

/* ── SKELETON ── */
.skeleton{
  animation:shimmer 1.4s infinite;
  background:linear-gradient(90deg,rgba(255,255,255,0.05) 0%,rgba(255,255,255,0.12) 50%,rgba(255,255,255,0.05) 100%);
  background-size:200% 100%;
  border-radius:8px;
}
@keyframes shimmer{to{background-position:-200% 0}}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  #app{padding:16px 12px 50px}
  .main-card{padding:20px}
  .weather-main{justify-content:flex-start}
  .weather-icon-main{width:90px;height:90px}
}

/* ── WIND COMPASS ── */
.wind-card{
  background:var(--glass);
  backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  border-radius:var(--card-radius);
  padding:20px;
  margin-bottom:20px;
}
.wind-top{
  display:flex;align-items:center;gap:28px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.compass-wrap{flex-shrink:0}
.compass{position:relative;width:100px;height:100px}
.compass-ring{
  width:100px;height:100px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.15);
  position:relative;display:flex;align-items:center;justify-content:center;
}
.compass-arrow{
  width:3px;height:40px;
  background:linear-gradient(to bottom,var(--accent),rgba(79,195,247,0.2));
  border-radius:2px;
  position:absolute;
  transform-origin:bottom center;
  bottom:50%;left:50%;
  margin-left:-1.5px;
  transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);
}
.compass-n{
  position:absolute;font-size:9px;font-weight:700;color:var(--text-dim);
  top:4px;left:50%;transform:translateX(-50%);
}
.compass-dirs{
  position:absolute;inset:0;
}
.compass-dirs span{
  position:absolute;font-size:8px;color:rgba(255,255,255,0.3);
}
.compass-dirs .cn{top:6px;left:50%;transform:translateX(-50%)}
.compass-dirs .cs{bottom:6px;left:50%;transform:translateX(-50%)}
.compass-dirs .cw{left:6px;top:50%;transform:translateY(-50%)}
.compass-dirs .ce{right:6px;top:50%;transform:translateY(-50%)}

.wind-info{flex:1}
.wind-speed-big{font-size:40px;font-weight:300;font-family:'DM Sans',sans-serif;line-height:1}
.wind-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.wind-stats{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.wind-stat-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06)}

/* ── LOADING OVERLAY ── */
#loading{
  position:fixed;inset:0;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,20,30,0.85);
  backdrop-filter:blur(10px);
  transition:opacity 0.5s;
}
#loading.hidden{opacity:0;pointer-events:none}
.loader-icon{font-size:60px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.loader-text{margin-top:16px;font-size:14px;color:var(--text-dim)}

/* sun/moon arc */
.sun-arc{
  background:var(--glass);
  backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  border-radius:var(--card-radius);
  padding:20px;
  margin-bottom:20px;
}
.arc-svg{width:100%;height:80px}
</style>
</head>
<body>

<div id="bg"></div>
<div id="particles"></div>

<div id="loading">
  <div class="loader-icon">🌤️</div>
  <div class="loader-text">Se încarcă datele meteo…</div>
</div>

<div id="app">

  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Caută un oraș…" autocomplete="off" />
      <span class="search-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </span>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button class="btn-gps" id="btn-gps" title="Locația mea">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        <circle cx="12" cy="12" r="9" stroke-dasharray="2 4"/>
      </svg>
    </button>
  </div>

  <div id="quick-locations" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"></div>

  <div id="error-msg"></div>

  <div class="main-card" id="main-card" style="display:none">
    <div class="location-row">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span id="country-name"></span>
      <span id="local-time" style="margin-left:auto;font-size:13px;font-weight:500;letter-spacing:0.3px;text-transform:capitalize;"></span>
    </div>
    <div class="city-name" id="city-name">—</div>
    <div class="weather-desc" id="weather-desc">—</div>
    <div class="feel" id="feel-text"></div>
    
    <div class="rain-alert" id="rain-alert"></div>
    <div class="weather-main">
      <div class="temp-block">
        <div class="temp-val" id="temp-val">—</div>
        <div class="temp-unit">°C</div>
      </div>
      <svg class="weather-icon-main" id="icon-main" viewBox="0 0 120 120"></svg>
    </div>
    <div class="stats-row" id="stats-row"></div>
  </div>

  <div class="hourly-outer" id="hourly-outer" style="display:none">
    <div class="section-title">Prognoză orară</div>
    <div class="hourly-scroll" id="hourly-scroll"></div>
  </div>

  <div class="chart-card" id="rain6h-card" style="display:none">
    <div class="section-title">Precipitații — următoarele 6 ore</div>
    <div class="chart-wrap"><canvas id="rain6h-chart"></canvas></div>
  </div>

  <div class="ten-day-card" id="ten-day-card" style="display:none">
    <div class="section-title">Prognoză 6 zile</div>
    <div id="ten-day-rows"></div>
  </div>

  <div class="chart-card" id="rain10d-card" style="display:none">
    <div class="section-title" style="justify-content:space-between;align-items:center">
      <span style="display:flex;align-items:center;gap:8px">
        Precipitații totale — 6 zile (mm)
        <span style="flex:1;height:1px;background:rgba(255,255,255,0.1);display:inline-block;min-width:20px"></span>
      </span>
      <span id="rain10d-total" style="font-size:13px;font-weight:600;color:#4fc3f7;background:rgba(79,195,247,0.12);border:1px solid rgba(79,195,247,0.3);border-radius:20px;padding:3px 12px;white-space:nowrap;letter-spacing:0"></span>
    </div>
    <div class="chart-wrap" style="height:200px"><canvas id="rain10d-chart"></canvas></div>
  </div>

  <div class="wind-card" id="wind-card" style="display:none">
    <div class="section-title">Vânt</div>
    <div class="wind-top">
      <div class="compass-wrap">
        <div class="compass-ring">
          <div class="compass-dirs">
            <span class="cn" style="color:rgba(255,80,80,0.8)">N</span>
            <span class="cs">S</span>
            <span class="cw">V</span>
            <span class="ce">E</span>
          </div>
          <div class="compass-arrow" id="compass-arrow"></div>
        </div>
      </div>
      <div class="wind-info">
        <div class="wind-label">Vânt curent</div>
        <div style="display:flex;align-items:baseline;gap:6px">
          <div class="wind-speed-big" id="wind-speed-big">—</div>
          <div style="font-size:14px;color:var(--text-dim)">km/h</div>
        </div>
        <div class="wind-stats" id="wind-stats"></div>
      </div>
    </div>
    <div class="wind-label" style="margin-bottom:8px">Evoluție — următoarele 24 ore</div>
    <div class="chart-wrap"><canvas id="wind-chart"></canvas></div>
  </div>

</div>

<script>
/* ════════════════════════════════
   CONFIG
════════════════════════════════ */
const API_KEY = 'ee0752dafdd6f36c381645918f861faa';

const QUICK_LOCATIONS = [
  { label: 'București', lat: 44.4268, lon: 26.1025 },
  { label: 'Bolintin Vale', lat: 44.44889, lon: 25.75778 },
];

const BASE = 'https://api.openweathermap.org/data/2.5';
const GEO  = 'https://api.openweathermap.org/geo/1.0';

let rain6hChart = null;
let rain10dChart = null;
let windChart = null;
let currentWeatherData = null;

/* ════════════════════════════════
   API KEY CHECK
════════════════════════════════ */
function checkApiKey(){
  if(!API_KEY || API_KEY === 'CHEIA_TA_API_AICI'){
    showError('⚠️ Introdu cheia API OpenWeatherMap în variabila API_KEY din fișierul HTML.');
    document.getElementById('loading').classList.add('hidden');
    return false;
  }
  return true;
}

/* ════════════════════════════════
   SEARCH / AUTOCOMPLETE
════════════════════════════════ */
let sugTimeout;
const searchInput = document.getElementById('search-input');
const sugBox = document.getElementById('suggestions');

searchInput.addEventListener('input', ()=>{
  clearTimeout(sugTimeout);
  const q = searchInput.value.trim();
  if(q.length < 2){sugBox.classList.remove('open');return}
  sugTimeout = setTimeout(()=>fetchSuggestions(q), 350);
});

searchInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    sugBox.classList.remove('open');
    const q = searchInput.value.trim();
    if(q) fetchByName(q);
  }
});

document.addEventListener('click', e=>{
  if(!e.target.closest('.search-box')) sugBox.classList.remove('open');
});
